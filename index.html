<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Comissão</title>
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5 7 9 11.5 9 16.5a9 9 0 0 1-18 0C7 14.5 11 10 16 3z' fill='%23A97B1E'/%3E%3C/svg%3E">
<style>
:root{
  --fundo:#F2F4F1; --papel:#FAFBF9; --tinta:#1D2721; --suave:#56665C; --linha:#D3DBD5;
  --oleo:#A97B1E; --oleoTexto:#7E5A10; --oleoClaro:#F1E5C6; --perigo:#9B2C2C;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --fundo:#121815; --papel:#18201C; --tinta:#E6EBE6; --suave:#9DAAA2; --linha:#2C3631;
  --oleo:#D9A94A; --oleoTexto:#E2B866; --oleoClaro:#3A321F; --perigo:#E07A7A;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.55 var(--sans);
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0);min-height:100vh}
main{max-width:34rem;margin:0 auto;padding:1.25rem 1.25rem 0}
.tela{min-height:calc(100vh - 6rem);display:flex;flex-direction:column}
.tela.centro{justify-content:center;align-items:center}
h1{font:600 clamp(1.65rem,6.4vw,2.25rem)/1.18 var(--serif);letter-spacing:-.01em;margin:.4rem 0 .9rem;text-wrap:balance}
h2{font:600 1.2rem/1.3 var(--serif);margin:1.6rem 0 .4rem}
p{margin:.5rem 0}
.lead{font-size:1.12rem;color:var(--tinta)}
.voz{color:var(--suave);font-size:.92rem;margin:0}
.nota{color:var(--suave);font-size:.9rem}
.pe{margin-top:auto;padding:1.5rem 0;text-align:center}
.centro{text-align:center}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
cite{font-style:normal;color:var(--oleoTexto);font-size:.82rem;letter-spacing:.01em}

/* trilha: a gota de óleo que anda */
#trilha{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--fundo) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:.7rem 1.25rem .5rem;border-bottom:1px solid var(--linha)}
#trilha ol{list-style:none;margin:0 auto;padding:0;max-width:34rem;display:flex;justify-content:space-between;position:relative}
#trilha ol::before{content:"";position:absolute;left:6px;right:6px;top:6px;height:1px;background:var(--linha)}
#trilha li{position:relative;display:flex;flex-direction:column;align-items:center;gap:.25rem;flex:1}
#trilha li:first-child{align-items:flex-start}#trilha li:last-child{align-items:flex-end}
#trilha .gota{width:12px;height:12px;border-radius:50%;background:var(--fundo);border:1.5px solid var(--linha);position:relative;z-index:1}
#trilha li.feito .gota{background:var(--suave);border-color:var(--suave)}
#trilha li.agora .gota{width:14px;height:14px;margin-top:-1px;border:0;background:var(--oleo);border-radius:50% 0 50% 50%;transform:rotate(-45deg);box-shadow:0 0 0 4px var(--oleoClaro)}
#trilha .rot{font-size:.7rem;color:var(--suave);white-space:nowrap}
#trilha li.agora .rot{color:var(--tinta);font-weight:600}
@media (max-width:420px){#trilha li:not(.agora) .rot{visibility:hidden}}
#trilha .funcaoAtual{max-width:34rem;margin:.35rem auto 0;font:600 .95rem var(--serif);color:var(--oleoTexto)}

/* citações */
blockquote{margin:1.1rem 0;padding:.2rem 0 .2rem 1rem;border-left:3px solid var(--oleo)}
blockquote p{font:1.12rem/1.5 var(--serif);margin:0 0 .35rem}

/* botões */
.btn{appearance:none;display:block;width:100%;min-height:3.4rem;padding:.8rem 1.1rem;border-radius:14px;border:1.5px solid var(--tinta);background:var(--tinta);color:var(--fundo);font:600 1.05rem var(--sans);cursor:pointer;margin-top:.6rem;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.985)}
.btn.leve{background:transparent;color:var(--tinta);border-color:var(--linha)}
.btn.curto{display:inline-block;width:auto;min-height:2.7rem;padding:.5rem 1rem;font-size:.95rem}
.btn[disabled]{opacity:.35;cursor:default}
.btn.ocupado{opacity:.6}
.link{background:none;border:0;color:var(--suave);text-decoration:underline;font:inherit;font-size:.9rem;cursor:pointer;padding:.4rem}
:focus-visible{outline:3px solid var(--oleo);outline-offset:2px}
.acoes{position:sticky;bottom:0;margin-top:auto;padding:1rem 0 calc(1rem + env(safe-area-inset-bottom,0));background:linear-gradient(to bottom,transparent,var(--fundo) 28%)}

/* campos */
.campo{display:block;margin:.9rem 0}
.campo>span:not(.sr){display:block;font-size:.88rem;color:var(--suave);margin-bottom:.3rem}
input,textarea{width:100%;font:1.05rem var(--sans);color:var(--tinta);background:var(--papel);border:1.5px solid var(--linha);border-radius:12px;padding:.85rem .9rem}
textarea{resize:vertical;line-height:1.45}
input:focus,textarea:focus{border-color:var(--oleo);outline:none}
.linhaAdd{display:flex;gap:.5rem;align-items:center;margin:.6rem 0}
.linhaAdd .btn{margin:0;flex:none}

/* escolhas */
.escolhas,.escolhidos{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}
.chip{appearance:none;border:1.5px solid var(--linha);background:var(--papel);color:var(--tinta);border-radius:999px;padding:.55rem .95rem;font:.98rem var(--sans);cursor:pointer}
.chip.on{background:var(--oleoClaro);border-color:var(--oleo)}
.nomes{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.5rem;margin:.6rem 0}
.nomeBtn{appearance:none;text-align:left;border:1.5px solid var(--linha);background:var(--papel);color:var(--tinta);border-radius:12px;padding:.75rem .85rem;font:1rem/1.25 var(--sans);cursor:pointer;min-height:3.1rem;display:flex;flex-direction:column;justify-content:center;gap:.15rem}
.nomeBtn small{font-size:.75rem;color:var(--suave)}
.nomeBtn.on{background:var(--oleoClaro);border-color:var(--oleo);font-weight:600}
.nomeBtn.on::after{content:"";width:8px;height:8px;border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:var(--oleo);position:absolute;opacity:0}
.nomeBtn.fora{opacity:.55;text-decoration:line-through;text-decoration-color:var(--suave)}
.votos{display:grid;gap:.6rem;margin:1rem 0}
.voto{appearance:none;text-align:left;border:1.5px solid var(--linha);background:var(--papel);color:var(--tinta);border-radius:14px;padding:1.05rem 1.1rem;font:600 1.1rem var(--serif);cursor:pointer}
.voto.on{border-color:var(--oleo);background:var(--oleoClaro);box-shadow:inset 0 0 0 1px var(--oleo)}

/* listas de conteúdo */
.combinados,.caract,.perguntas,.candidatos,.feitas,.apuracao,.relatorio{list-style:none;margin:.8rem 0;padding:0}
.combinados li,.perguntas li{padding:.85rem 0;border-top:1px solid var(--linha);display:grid;gap:.15rem}
.combinados strong,.perguntas strong{font:600 1.08rem var(--serif)}
.caract li{padding:.6rem 0;border-top:1px solid var(--linha);display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.caract li span{font-size:1.04rem}.caract cite{text-align:right;flex:none;max-width:45%}
.candidatos li{padding:.7rem 0;border-top:1px solid var(--linha);font:1.15rem var(--serif);display:flex;flex-wrap:wrap;gap:.4rem;align-items:baseline;justify-content:space-between}
.tags{display:inline-flex;flex-wrap:wrap;gap:.35rem}.tags small{font:.75rem var(--sans);color:var(--oleoTexto);background:var(--oleoClaro);border-radius:6px;padding:.15rem .45rem}
.tags.grandes{margin:-.4rem 0 .4rem}.tags.grandes small{font-size:.85rem}
.lista{display:grid;gap:.5rem;margin:.6rem 0}
.item{appearance:none;text-align:left;border:1.5px solid var(--linha);background:var(--papel);color:var(--tinta);border-radius:12px;padding:.9rem 1rem;font:600 1.05rem var(--serif);cursor:pointer;display:flex;flex-direction:column;gap:.15rem}
.item em,.feitas em{font:normal .85rem var(--sans);color:var(--suave)}
.item.ok{background:transparent;border-style:dashed}.item.ok em{color:var(--oleoTexto)}
.feitas li{padding:.55rem 0;border-top:1px solid var(--linha);display:flex;flex-direction:column}
.apuracao li{display:flex;justify-content:space-between;padding:.55rem 0;border-top:1px solid var(--linha);font-size:1.05rem}
.relatorio li{padding:.85rem 0;border-top:1px solid var(--linha);display:grid;gap:.2rem}
.relatorio .fn{font-size:.85rem;color:var(--suave)}.relatorio .nm{font:600 1.15rem var(--serif)}.relatorio .vazio{font-weight:400;color:var(--suave);font-size:1rem}
.relatorio .an{font-size:.88rem;color:var(--suave)}
.relatorio .estado + .nm{margin-top:.8rem}
.estado{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.3rem}
.mini{appearance:none;border:1px solid var(--linha);background:transparent;color:var(--suave);border-radius:999px;padding:.35rem .7rem;font:.82rem var(--sans);cursor:pointer}
.mini.on{background:var(--tinta);color:var(--fundo);border-color:var(--tinta)}

/* observações */
.criterios.apagado{opacity:.35;pointer-events:none}
.criterio{border:0;border-top:1px solid var(--linha);margin:0;padding:.9rem 0 .4rem}
.criterio legend{padding:0;font:600 1.08rem var(--serif);display:flex;gap:.6rem;align-items:baseline;width:100%}
.peso{font:600 .78rem var(--sans);color:var(--oleoTexto);background:var(--oleoClaro);border-radius:6px;padding:.1rem .4rem}
.niveis{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0 .3rem}
.nivel{appearance:none;border:1.5px solid var(--linha);background:var(--papel);color:var(--tinta);border-radius:999px;padding:.5rem .8rem;font:.9rem var(--sans);cursor:pointer}
.nivel.on{background:var(--oleoClaro);border-color:var(--oleo);font-weight:600}
.quadro{list-style:none;padding:0;margin:.8rem 0}
.quadro li{padding:.8rem 0;border-top:1px solid var(--linha)}
.qnome{display:flex;justify-content:space-between;align-items:baseline;font:1.12rem var(--serif)}
.qnome small{font:.75rem var(--sans);color:var(--oleoTexto)}
.qnome b{font:600 1.4rem var(--serif)}
.barra{height:8px;border-radius:4px;background:var(--linha);margin:.4rem 0 .2rem;overflow:hidden}
.barra i{display:block;height:100%;background:var(--oleo);border-radius:4px}
/* momentos */
.calma h1{margin-top:2rem}
.alternancia{margin:1.2rem 0;padding:1rem 1.1rem;border:1px solid var(--oleo);border-radius:14px;background:color-mix(in srgb,var(--oleoClaro) 55%,transparent)}
.alternancia p:not(.voz){font-size:.98rem}
.qrBox{background:#fff;border-radius:18px;padding:1rem;margin:.6rem auto;max-width:17rem;text-align:center;border:1px solid var(--linha)}
#qr svg{width:100%;height:auto;display:block}
.codigo{font:600 1.7rem/1 var(--sans);letter-spacing:.12em;color:#1D2721;margin:.6rem 0 .1rem}
.presentes{color:var(--suave)}
.contador{color:var(--suave);font-size:.92rem;margin-top:1rem}
.espera{display:flex;align-items:center;gap:.6rem;color:var(--suave);margin-top:auto;padding:1.2rem 0 calc(1.2rem + env(safe-area-inset-bottom,0))}
.pulso{width:10px;height:10px;border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:var(--oleo);animation:pulso 1.8s ease-in-out infinite;flex:none}
@keyframes pulso{50%{opacity:.25}}
.aviso{background:var(--oleoClaro);border-radius:10px;padding:.7rem .9rem;font-size:.95rem}
.aviso.suave{border-left:3px solid var(--oleo)}
.selo{font-size:.88rem;color:var(--oleoTexto);background:var(--oleoClaro);padding:.5rem .8rem;border-radius:10px}
.erro{margin:.8rem 0;padding:.8rem 1rem;border-radius:12px;border:1.5px solid var(--perigo);color:var(--perigo);background:var(--papel)}
.perigo{margin:1.2rem 0 2rem;color:var(--suave);font-size:.92rem}.perigo summary{cursor:pointer;padding:.4rem 0}
.perigoBtn{background:var(--perigo)!important;border-color:var(--perigo)!important;color:#fff!important}
#toast{position:fixed;left:50%;bottom:calc(6.5rem + env(safe-area-inset-bottom,0));transform:translate(-50%,1rem);background:var(--tinta);color:var(--fundo);padding:.7rem 1.1rem;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:9}
#toast.ver{opacity:1;transform:translate(-50%,0)}

/* o único movimento: a tela nova entra devagar quando o passo muda */
.entra{animation:entra .42s cubic-bezier(.2,.7,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.entra,.pulso{animation:none}.btn{transition:none}}
</style>
</head>

async function backendFirebase(cfg) {
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  const cred = await A.signInAnonymously(auth);
  const db = F.getFirestore(app);
  const mref = c => F.doc(db, 'reunioes', c);
  const eref = (c, id) => F.doc(db, 'reunioes', c, 'entradas', id);
  return {
    uid: cred.user.uid,
    getMeeting: async c => { const s = await F.getDoc(mref(c)); return s.exists() ? s.data() : null; },
    watchMeeting: (c, cb) => F.onSnapshot(mref(c), s => cb(s.exists() ? s.data() : null), e => falha(e)),
    watchEntries: (c, cb) => F.onSnapshot(F.collection(db, 'reunioes', c, 'entradas'), q => cb(q.docs.map(d => ({ id: d.id, ...d.data() }))), e => falha(e)),
    setMeeting: (c, data) => F.setDoc(mref(c), data),
    setEntry: (c, id, data) => F.setDoc(eref(c, id), data),
    addEntry: (c, data) => F.addDoc(F.collection(db, 'reunioes', c, 'entradas'), data),
    async deleteMeeting(c) {
      const q = await F.getDocs(F.collection(db, 'reunioes', c, 'entradas'));
      for (const d of q.docs) await F.deleteDoc(d.ref);
      await F.deleteDoc(mref(c));
    }
  };
}
function backendTeste() {
  let uid = sessionStorage.getItem('uidTeste');
  if (!uid) { uid = 'u' + rand(10); sessionStorage.setItem('uidTeste', uid); }
  const canal = new BroadcastChannel('comissao-teste');
  const ouvintes = [];
  const ler = c => JSON.parse(localStorage.getItem('teste:' + c) || '{"m":null,"e":{}}');
  const avisar = c => ouvintes.filter(o => o.c === c).forEach(o => o.f(ler(c)));
  const gravar = (c, st) => { localStorage.setItem('teste:' + c, JSON.stringify(st)); canal.postMessage(c); setTimeout(() => avisar(c)); };
  canal.onmessage = ev => avisar(ev.data);
  const ouvir = (c, f) => { const o = { c, f }; ouvintes.push(o); setTimeout(() => f(ler(c))); return () => ouvintes.splice(ouvintes.indexOf(o), 1); };
  return {
    uid,
    getMeeting: async c => ler(c).m,
    watchMeeting: (c, cb) => ouvir(c, st => cb(st.m)),
    watchEntries: (c, cb) => ouvir(c, st => cb(Object.entries(st.e).map(([id, d]) => ({ id, ...d })))),
    setMeeting: async (c, data) => { const st = ler(c); st.m = JSON.parse(JSON.stringify(data)); gravar(c, st); },
    setEntry: async (c, id, data) => { const st = ler(c); st.e[id] = data; gravar(c, st); },
    addEntry: async (c, data) => { const st = ler(c); st.e['a' + rand(12)] = data; gravar(c, st); },
    deleteMeeting: async c => { localStorage.removeItem('teste:' + c); canal.postMessage(c); setTimeout(() => avisar(c)); }
  };
}
function falha(e) {
  console.error(e);
  S.ui.erro = 'A conexão com o banco de dados falhou. Confira a internet e toque em Tentar de novo.';
  render();
}

async function iniciar() {
  const p = new URLSearchParams(location.search);
  const h = location.hash;
  if (h.startsWith('#c=')) {
    try { const cfg = JSON.parse(b64d(h.slice(3))); localStorage.setItem('cfg', JSON.stringify(cfg)); localStorage.setItem('modo', 'fb'); } catch (e) { }
  } else if (h === '#teste') { localStorage.setItem('modo', 'demo'); }
  if (h) history.replaceState(null, '', location.pathname + location.search);
  const codigoLink = (p.get('r') || '').toUpperCase();

  if (!modo()) { S.tela = 'configurar'; render(); return; }
  await conectar();
  const sessao = JSON.parse(guarda().getItem('sessao') || 'null');
  if (codigoLink && (!sessao || sessao.code !== codigoLink)) { S.ui.codigo = codigoLink; S.tela = 'nome'; render(); return; }
  if (sessao) { await entrar(sessao.code, sessao.nome, true); return; }
  S.tela = 'inicio'; render();
}
async function conectar() {
  if (S.backend) return;
  S.tela = 'carregando'; render();
  try {
    S.backend = modo() === 'demo' ? backendTeste() : await backendFirebase(JSON.parse(localStorage.getItem('cfg')));
    S.uid = S.backend.uid;
  } catch (e) {
    console.error(e);
    S.tela = 'erroConexao'; render();
    throw e;
  }
}
async function entrar(code, nome, silencioso) {
  const m = await S.backend.getMeeting(code);
  if (!m) {
    guarda().removeItem('sessao');
    S.ui.aviso = silencioso ? '' : 'Não encontrei uma reunião com esse código. Confira as letras com o presidente.';
    S.tela = silencioso ? 'inicio' : 'nome'; render(); return;
  }
  S.code = code;
  guarda().setItem('sessao', JSON.stringify({ code, nome }));
  await S.backend.setEntry(code, 'p_' + S.uid, { t: 'p', uid: S.uid, nome, at: Date.now() });
  observar();
}
function observar() {
  S.unsub.forEach(u => u()); S.unsub = [];
  S.unsub.push(S.backend.watchMeeting(S.code, m => {
    if (!m) { // reunião apagada
      S.M = null; S.E = []; guarda().removeItem('sessao'); S.tela = 'apagada'; render(); return;
    }
    S.M = m; S.tela = 'reuniao'; render();
  }));
  S.unsub.push(S.backend.watchEntries(S.code, es => { S.E = es; if (S.M) render(); }));
}

      <h2>${ps.length <= 1 ? 'Só você por enquanto.' : `${ps.length} pessoas aqui`}</h2>
      <p class="presentes">${ps.map(x => esc(x.nome)).join(', ')}</p>
      ${rodape(botao('comecar', 'Começar a reunião'))}</section>`;
  },
  abertura(p) {
    const c = ABERTURA[p.s || 0];
    const corpo = c.lista ? `<ul class="combinados">${c.lista.map(([t, d, r]) => `<li><strong>${esc(t)}</strong><span>${esc(d)}</span><cite>${esc(r)}</cite></li>`).join('')}</ul>`
      : `<p class="lead">${esc(c.fala)}</p>${cita(c.cita, c.ref)}`;
    return `<section class="tela"><h1>${esc(c.titulo)}</h1>${corpo}
      ${souPresidente() ? rodape(botao('seguirAbertura', 'Seguir')) : esperaPresidente()}</section>`;
  },
  estudo(p) {
    const i = p.s || 0, c = ESTUDO[i];
    return `<section class="tela"><p class="voz">Cinco frases para lembrar · ${i + 1} de ${ESTUDO.length}</p>
      <h1>${esc(c.titulo)}</h1>${cita(c.cita, c.ref)}${c.nota ? `<p class="nota">${esc(c.nota)}</p>` : ''}
      ${souPresidente() ? rodape(botao('seguirEstudo', 'Seguir') + (i > 0 ? botao('voltarEstudo', 'Voltar', 'leve') : '')) : esperaPresidente()}</section>`;
  },
  escolherFuncao() {
    const fs = S.M.funcoes;
    const status = f => { const es = escolhidos(f.id); if (es.length) return es.map(e => nomeDe(e.id) + (e.anuencia === 'nao' ? ' (não aceitou)' : '')).join(', '); return S.M.resultados?.[f.id]?.adiada ? 'fica para outro dia' : ''; };
    const feita = f => { const es = escolhidos(f.id); return es.length && es.every(e => e.anuencia !== 'nao'); };
    const horas = (Date.now() - (S.M.inicio || Date.now())) / 36e5;
    if (!souPresidente()) return `<section class="tela"><h1>Qual função agora?</h1><p class="lead">O presidente está escolhendo.</p>
      <ul class="feitas">${fs.map(f => `<li class="${feita(f) ? 'ok' : ''}"><span>${esc(f.nome)}</span><em>${esc(status(f))}</em></li>`).join('')}</ul>${esperaPresidente('Aguardando…')}</section>`;
    const pend = fs.filter(f => !feita(f));
    return `<section class="tela"><h1>Qual função agora?</h1>
      ${horas >= 2 ? `<p class="aviso suave">Já são mais de duas horas. “Ofereçam repouso ao cérebro cansado” (T7 256.2). Vocês podem continuar outro dia com o mesmo código.</p>` : ''}
      <div class="lista">${fs.map(f => `<button class="item ${feita(f) ? 'ok' : ''}" data-a="abrirFuncao" data-f="${f.id}"><span>${esc(f.nome)}</span><em>${esc(status(f))}</em></button>`).join('')}</div>
      ${rodape(pend.length ? botao('irFim', 'Encerrar por hoje', 'leve') : botao('irFim', 'Ver o relatório final'))}</section>`;
  },
  funcao(p) {
    const f = funcao(p.f), tp = TIPOS[f.tipo] || TIPOS.dirigente;
    return `<section class="tela"><p class="voz">O que Deus pede para esta função</p>
      <h1>${esc(f.nome)}</h1>
      <ul class="caract">${tp.linhas.map(([l, r]) => `<li><span>${esc(l)}</span>${r ? `<cite>${esc(r)}</cite>` : ''}</li>`).join('')}</ul>
      ${cita(tp.cita, tp.ref)}
      <p class="nota">Antes de tudo isso vem a pergunta principal: a pessoa anda com Deus? Escolham também entre as mulheres, onde a função permitir.</p>
      ${souPresidente() ? rodape(botao('abrirPropostas', 'Abrir as propostas') + botao('voltarEscolher', 'Voltar', 'leve')) : esperaPresidente()}</section>`;
  },
  propostas(p) {
    const f = funcao(p.f);
    const enviados = entradas('pr', p.f, p.r);
    const minha = minhaEntrada('pr', p.f, p.r);
    if (S.ui.selPropostaF !== p.f + p.r) { S.ui.selPropostaF = p.f + p.r; S.ui.sel = new Set(minha?.ids || []); S.ui.editando = !minha; }
    const sel = S.ui.sel;
    const contagem = `<p class="contador">${enviados.length} de ${presentes().length} já enviaram</p>`;
    if (minha && !S.ui.editando) {
      return `<section class="tela"><h1>Seu discernimento foi enviado.</h1>
        <p class="lead">${minha.ids.length ? `Você trouxe ${minha.ids.map(nomeDe).map(esc).join(', ')}.` : 'Você ainda não trouxe nenhum nome.'}</p>
        <p>Ninguém vê quem propôs quem. Os nomes vão se juntar numa lista única.</p>${contagem}
        ${rodape((souPresidente() ? botao('fecharPropostas', 'Ver a lista', '', enviados.length ? '' : 'disabled') : '') + botao('editarProposta', 'Mudar minha proposta', 'leve'))}
        ${esperaPresidente('Aguardando os outros…')}</section>`;
    }
    const busca = norm(S.ui.busca || '');
    const lista = S.M.membros.filter(m => !busca || norm(m.nome).includes(busca));
    return `<section class="tela"><p class="voz">Em silêncio, cada um no seu celular</p>
      <h1>Em oração, quem você percebe que Deus está chamando para ${esc(f.nome)}?</h1>
      <p>Pode trazer mais de um nome, ou nenhum, se ainda não discerniu. Ninguém vai saber quem trouxe quem.</p>
      ${sel.size ? `<div class="escolhidos">${[...sel].map(id => `<button class="chip on" data-a="togNome" data-id="${id}" aria-label="Tirar ${esc(nomeDe(id))}">${esc(nomeDe(id))} ✕</button>`).join('')}</div>` : ''}
      <label class="campo"><span class="sr">Procurar nome</span><input id="buscaNome" placeholder="Procurar nome" value="${esc(S.ui.busca || '')}" autocomplete="off"></label>
      <div class="nomes">${lista.map(m => `<button class="nomeBtn ${sel.has(m.id) ? 'on' : ''}" data-a="togNome" data-id="${m.id}" aria-pressed="${sel.has(m.id)}">${esc(m.nome)}${servemHoje(p.f).includes(m.id) ? '<small>serve hoje</small>' : ''}</button>`).join('') || '<p class="nota">Nenhum nome com essas letras.</p>'}</div>
      ${contagem}
      ${rodape(botao('enviarProposta', sel.size ? `Enviar ${plural(sel.size, 'nome', 'nomes')}` : 'Ainda não discerni um nome') + (souPresidente() && enviados.length ? botao('fecharPropostas', 'Ver a lista', 'leve') : ''))}</section>`;
  },
  lista(p) {
    const f = funcao(p.f), ids = restantes(p.f), ja = escolhidos(p.f);
    const grande = ids.length > 3, afinada = (S.M.rodadaAval?.[p.f] || 1) > 1;
    return `<section class="tela"><p class="voz">${afinada ? 'A lista depois de afinar' : 'Todas as propostas, juntas'}</p>
      <h1>${ids.length === 0 ? (ja.length ? 'Não sobrou nome nesta lista.' : 'Ninguém foi proposto ainda.') : ids.length === 1 ? 'Um nome para conversar.' : `${ids.length} nomes para ${esc(f.nome)}.`}</h1>
      ${ja.length ? `<p class="nota">Já discernidos: ${ja.map(e => esc(nomeDe(e.id))).join(', ')}.</p>` : ''}
      <ul class="candidatos">${ids.map(id => `<li>${esc(nomeDe(id))}${tags(id, p.f)}</li>`).join('')}</ul>
      <p class="nota">${grande ? 'Todos os nomes passam pelas observações, com as três características. Com a lista grande, um ou dois minutos por nome. Depois, a lista é afinada pela nota da comissão, e os que ficam são vistos com mais atenção. A maioria só decide no voto final.' : 'Agora, observações com atenção: cada um conta o que sabe de cada pessoa, com calma.'}</p>
      ${souPresidente() ? rodape(ids.length === 0 ? botao('reabrirPropostas', 'Abrir as propostas de novo') : botao('irObservacoes', grande ? 'Começar as observações' : 'Observar com atenção'))
      : esperaPresidente()}</section>`;
  },
  filtro(p) {
    const ids = restantes(p.f);
    const minha = minhaEntrada('mk', p.f, p.r);
    const feitos = entradas('mk', p.f, p.r).length;
    const contador = `<p class="contador">${feitos} de ${presentes().length} já marcaram</p>`;
    if (S.ui.filtroChave !== p.f + p.r) { S.ui.filtroChave = p.f + p.r; S.ui.marc = new Set(minha?.ids || []); S.ui.editandoMarca = !minha; }
    if (minha && !S.ui.editandoMarca) return `<section class="tela"><h1>Suas marcas foram enviadas.</h1>
      <p class="lead">Ninguém vê o que você marcou.</p>${contador}
      ${rodape((souPresidente() ? botao('verFiltro', 'Ver o que fica', '', feitos ? '' : 'disabled') : '') + botao('editarMarca', 'Mudar minhas marcas', 'leve'))}${esperaPresidente('Aguardando os outros…')}</section>`;
    return `<section class="tela"><p class="voz">Rodada ${p.r} · em silêncio</p>
      <h1>Quais destes você discerne que devem seguir na conversa?</h1>
      <p>Marque quantos quiser. Os nomes que quase ninguém marcar saem da conversa, por agora.</p>
      <div class="nomes">${ids.map(id => `<button class="nomeBtn ${S.ui.marc.has(id) ? 'on' : ''}" data-a="togMarca" data-id="${id}" aria-pressed="${S.ui.marc.has(id)}">${esc(nomeDe(id))}${servemHoje(p.f).includes(id) ? '<small>serve hoje</small>' : ''}</button>`).join('')}</div>
      ${contador}
      ${rodape(botao('enviarMarca', 'Enviar minhas marcas') + (souPresidente() && feitos ? botao('verFiltro', 'Ver o que fica', 'leve') : ''))}</section>`;
  },
  filtroResultado(p) {
    const fica = new Set(S.M.proposta?.fica || []);
    const ids = restantes(p.f);
    if (!souPresidente()) return `<section class="tela"><h1>O presidente está conferindo a lista.</h1>${esperaPresidente('Aguardando…')}</section>`;
    const nt = S.M.proposta?.notas || {};
    return `<section class="tela"><p class="voz">Afinar a lista</p>
      <h1>${fica.size === ids.length ? 'Todos seguem.' : `Seguem ${plural(fica.size, 'nome', 'nomes')}.`}</h1>
      <p>A sugestão mantém os nomes com as maiores notas da comissão, mais ou menos a metade, sem cortar empates. Os que saem foram vistos com as mesmas três características. Toque para ajustar se a comissão sentir diferente.</p>
      <div class="nomes">${S.M.proposta.ordem.map(id => `<button class="nomeBtn ${fica.has(id) ? 'on' : 'fora'}" data-a="togFica" data-id="${id}" aria-pressed="${fica.has(id)}">${esc(nomeDe(id))}<small>${nt[id] != null ? 'nota ' + nt[id] + ' · ' : ''}${fica.has(id) ? 'segue' : 'sai por agora'}</small></button>`).join('')}</div>
      ${rodape(botao('confirmarFiltro', 'Confirmar', '', fica.size ? '' : 'disabled') + botao('voltarLista', 'Voltar', 'leve'))}</section>`;
  },
  observacoes(p) {
    const ids = restantes(p.f), i = Math.min(p.i || 0, ids.length - 1), id = ids[i];
    const ra = S.M.rodadaAval?.[p.f] || 1;
    const chaveNota = `nota:${S.code}:${p.f}:${id}`;
    const minha = entradas('av', p.f, ra).find(e => e.uid === S.uid && e.c === id) || {};
    const feitos = entradas('av', p.f, ra).filter(e => e.c === id && (e.nc || notaDe(e) !== null)).length;
    const completo = minha.nc || notaDe(minha) !== null;
    return `<section class="tela"><p class="voz">Observações · ${i + 1} de ${ids.length}</p>
      <h1>${esc(nomeDe(id))}</h1>${tags(id, p.f, true)}
      <p class="lead">${ids.length > 3 ? 'Um ou dois minutos: quem souber de algum fato importante sobre essa pessoa, fala agora.' : 'Com calma. Cada um conta o que sabe dessa pessoa que os outros talvez não saibam. Fatos, com amor.'}</p>
      <p>Depois, cada um, em oração e em silêncio, marca o que percebe. Ninguém vê a marcação do outro.</p>
      <div class="criterios ${minha.nc ? 'apagado' : ''}">${CRITERIOS.map(c => `<fieldset class="criterio"><legend><strong>${esc(c.t)}</strong> <span class="peso">${c.peso}%</span></legend>
        <p class="nota">${esc(c.d)}${c.ref ? ` <cite>${esc(c.ref)}</cite>` : ''}</p>
        <div class="niveis">${NIVEIS.map(([v, r]) => `<button class="nivel ${minha[c.k] === v ? 'on' : ''}" data-a="avaliar" data-c="${id}" data-k="${c.k}" data-v="${v}" aria-pressed="${minha[c.k] === v}">${r}</button>`).join('')}</div></fieldset>`).join('')}</div>
      <p class="nota"><strong>E a experiência?</strong> Já ter servido não pesa contra nem a favor. Só ajuda a desempatar.</p>
      <p><button class="link" data-a="avaliar" data-c="${id}" data-k="nc" data-v="${minha.nc ? 0 : 1}">${minha.nc ? 'Quero marcar esta pessoa' : 'Não conheço esta pessoa o bastante para marcar'}</button></p>
      <p class="contador">${completo ? 'Sua marcação está guardada. ' : ''}${feitos} de ${presentes().length} já marcaram</p>
      <label class="campo nota-campo"><span>Sua anotação · fica só neste celular</span><textarea id="nota-${id}" data-nota="${esc(chaveNota)}" rows="3">${esc(localStorage.getItem(chaveNota) || '')}</textarea></label>
      <p class="nota">Se for preciso perguntar algo fora da comissão, quem pergunta é o presidente (Manual da Igreja, cap. 10).</p>
      ${souPresidente() ? rodape((i + 1 < ids.length ? botao('obsProx', 'Próximo nome') : botao('irQuadro', 'Ver o quadro da comissão')) + (i > 0 ? botao('obsAnt', 'Voltar', 'leve') : botao('voltarLista', 'Ver a lista', 'leve'))) : esperaPresidente()}</section>`;
  },
  quadro(p) {
    const ids = restantes(p.f), ra = S.M.rodadaAval?.[p.f] || 1;
    const linhas = ids.map(id => {
      const es = entradas('av', p.f, ra).filter(e => e.c === id);
      return { id, r: consolidar(es.map(notaDe).filter(x => x !== null)), nc: es.filter(e => e.nc).length };
    });
    const avisos = [];
    linhas.forEach(l => { if (l.r && l.r.max - l.r.min > 30) avisos.push(`As percepções sobre ${esc(nomeDe(l.id))} estão bem diferentes (de ${l.r.min} a ${l.r.max}). Antes de votar, conversem e orem mais.`); });
    const comNota = linhas.filter(l => l.r).sort((a, b) => b.r.nota - a.r.nota);
    let empate = '';
    if (ids.length <= 3 && comNota.length > 1 && comNota[0].r.nota - comNota[1].r.nota <= 5) {
      const [x, y] = comNota, serve = [x, y].filter(l => servemHoje(p.f).includes(l.id));
      empate = `<div class="alternancia"><p class="voz">${esc(nomeDe(x.id))} e ${esc(nomeDe(y.id))} estão quase no mesmo nível</p>
        ${serve.length === 1 ? `<p>${esc(nomeDe(serve[0].id))} já serve nesta função. ${esc(ALTERNANCIA.dois)} <cite>${esc(ALTERNANCIA.refDois)}</cite></p>` : '<p>A diferença é pequena. Deixem a oração e o voto mostrarem.</p>'}</div>`;
    }
    return `<section class="tela"><p class="voz">Observações · o quadro da comissão</p>
      <h1>O que a comissão percebeu.</h1>
      <p class="lead">Um retrato das marcações de todos. Ajuda a ver; quem decide é o voto, depois da oração.</p>
      <ul class="quadro">${linhas.map(l => `<li><div class="qnome"><span>${esc(nomeDe(l.id))}${servemHoje(p.f).includes(l.id) ? ' <small>serve hoje</small>' : ''}</span><b>${l.r ? l.r.nota : '—'}</b></div>
        <div class="barra"><i style="width:${l.r ? l.r.nota : 0}%"></i></div>
        <p class="nota">${l.r ? `${plural(l.r.n, 'marcação', 'marcações')}${l.r.aparada ? ', sem a maior e a menor' : ''}` : 'Ninguém marcou ainda'}${l.nc ? ` · ${l.nc} sem conhecer o bastante` : ''}</p></li>`).join('')}</ul>
      ${avisos.map(a => `<p class="aviso">${a}</p>`).join('')}${empate}
      <p class="nota">Nota de 20 a 100: anda com Deus vale 70%; o que a função pede, 15%; o chamado que vocês sentem, 15%.</p>
      ${souPresidente() ? rodape(ids.length > 3
        ? botao('verFiltro', 'Afinar a lista pela nota') + botao('voltarObs', 'Conversar mais', 'leve') + botao('marcarDeNovo', 'Marcar de novo', 'leve')
        : botao('irOracao', 'Ir para a oração') + (ids.length > 1 ? botao('verFiltro', 'Afinar mais', 'leve') : '') + botao('voltarObs', 'Conversar mais', 'leve') + botao('marcarDeNovo', 'Marcar de novo', 'leve')) : esperaPresidente()}</section>`;
  },
  oracao(p) {
    const ids = restantes(p.f);
    const alguemServe = ids.some(id => servemHoje(p.f).includes(id));
    return `<section class="tela calma"><h1>Agora, entreguem a decisão a Deus.</h1>
      <p class="lead">Um momento de silêncio. Depois, alguém ora pedindo que Deus mostre a Sua escolha.</p>
      ${cita('Tu, Senhor, conhecedor dos corações de todos, mostra qual destes tens escolhido.', 'Atos 1:24')}
      ${alguemServe ? `<div class="alternancia"><p class="voz">Uma lembrança, porque alguém aqui já serve nesta função</p>
        <p>${esc(ALTERNANCIA.um)} <cite>${esc(ALTERNANCIA.refUm)}</cite></p><p>${esc(ALTERNANCIA.dois)} <cite>${esc(ALTERNANCIA.refDois)}</cite></p></div>` : ''}
      ${souPresidente() ? rodape(botao('abrirVoto', 'Abrir o discernimento secreto') + botao('voltarObs', 'Conversar mais', 'leve')) : esperaPresidente()}</section>`;
  },
  voto(p) {
    const ids = restantes(p.f), f = funcao(p.f);
    const feito = minhaEntrada('vd', p.f, p.r);
    const n = entradas('vd', p.f, p.r).length, total = presentes().length;
    const contador = `<p class="contador">${n} de ${total} já registraram</p>`;
    const acoesPres = souPresidente() ? (n >= total ? botao('apurar', 'Mostrar o resultado') : (n ? botao('apurar', 'Encerrar assim mesmo', 'leve') : '')) : '';
    if (feito) return `<section class="tela"><h1>O que você discerniu foi registrado.</h1><p class="lead">É secreto: nem o presidente sabe o que você registrou. Continue em oração pelos outros.</p>${contador}
      ${souPresidente() ? rodape(acoesPres) : esperaPresidente('Aguardando os outros…')}</section>`;
    const opcoes = ids.length === 1
      ? [[ids[0], `Sim, discirno que é ${nomeDe(ids[0])}`], ['nao', 'Ainda não discirno']]
      : [...ids.map(id => [id, nomeDe(id)]), ['branco', 'Ainda não discerni']];
    return `<section class="tela"><p class="voz">Voto secreto, em oração${p.r > 1 ? ` · ${p.r}ª vez` : ''}</p>
      <h1>${ids.length === 1 ? `Em sua consciência, você discerne que ${esc(nomeDe(ids[0]))} é a escolha de Deus para ${esc(f.nome)}?` : `Em sua consciência, quem você discerne ser a escolha de Deus para ${esc(f.nome)}?`}</h1>
      <div class="votos">${opcoes.map(([v, r]) => `<button class="voto ${S.ui.voto === v ? 'on' : ''}" data-a="marcarVoto" data-v="${v}" aria-pressed="${S.ui.voto === v}">${esc(r)}</button>`).join('')}</div>
      ${contador}
      ${rodape(botao('votar', 'Confirmar o que discerni', '', S.ui.voto ? '' : 'disabled') + acoesPres)}</section>`;
  },
  resultado(p) {
    const r = S.M.resultados[p.f]?.ultima || {}, f = funcao(p.f);
    const cont = Object.entries(r.contagem || {}).sort((a, b) => b[1] - a[1]);
    const rot = v => v === 'branco' ? 'Ainda não discerniram' : v === 'nao' ? 'Ainda não discernem' : nomeDe(v);
    const quadro = `<ul class="apuracao">${cont.map(([v, n]) => `<li><span>${esc(rot(v))}</span><b>${n}</b></li>`).join('')}</ul><p class="nota">${plural(r.total || 0, 'voto', 'votos')}. Para decidir é preciso mais da metade deles.</p>`;
    if (r.escolhido) {
      const ps = presentes(), e = escolhidos(p.f).find(x => x.id === r.escolhido) || {};
      const outros = escolhidos(p.f).filter(x => x.id !== r.escolhido);
      return `<section class="tela"><p class="voz">${esc(f.nome)}</p><h1>A comissão discerniu: ${esc(nomeDe(r.escolhido))}.</h1>${quadro}
        ${outros.length ? `<p class="nota">Já discernidos para ${esc(f.nome)}: ${outros.map(x => esc(nomeDe(x.id))).join(', ')}.</p>` : ''}
        ${ehOrganizadora() ? equilibrio() : ''}
        ${souPresidente() ? `<h2>Quem vai conversar com ${esc(nomeDe(r.escolhido))} para pedir a anuência?</h2>
          <p>${ehOrganizadora() ? 'Antes de a igreja votar, a pessoa precisa saber e concordar.' : 'Antes da primeira leitura na igreja, a pessoa precisa saber e concordar (Manual da Igreja, cap. 10).'}</p>
          <div class="escolhas">${ps.map(x => `<button class="chip ${e.quemConversa === x.nome ? 'on' : ''}" data-a="quemConversa" data-n="${esc(x.nome)}" aria-pressed="${e.quemConversa === x.nome}">${esc(x.nome)}</button>`).join('')}</div>
          ${rodape(botao('proximaFuncao', 'Próxima função') + botao('maisUm', `Discernir mais uma pessoa para ${esc(f.nome)}`, 'leve'))}` : esperaPresidente()}</section>`;
    }

function tags(id, fid, grande) {
  const t = [];
  if (servemHoje(fid).includes(id)) t.push('serve nesta função hoje');
  discernidoPara(id, fid).forEach(n => t.push('já discernido(a) para ' + n));
  if (!t.length) return '';
  return `<span class="tags ${grande ? 'grandes' : ''}">${t.map(x => `<small>${esc(x)}</small>`).join('')}</span>`;
}
function equilibrio() {
  const todos = (S.M.funcoes || []).flatMap(f => escolhidos(f.id).map(e => nomeDe(e.id)));
  return `<div class="alternancia"><p class="voz">Equilíbrio da comissão · ${plural(todos.length, 'nome', 'nomes')} até agora</p>
    <p>${todos.map(esc).join(', ')}</p>
    <p>Confiram juntos: idades diferentes, homens e mulheres, no máximo duas pessoas da mesma família. <cite>Manual da Igreja, cap. 10</cite></p></div>`;
}
function relatorioTexto() {
  const org = ehOrganizadora();
  const linhas = [`${S.M.igreja} — ${org ? 'recomendação da comissão organizadora para a comissão de nomeações' : 'relatório da comissão de nomeações'}`, ''];
  for (const f of S.M.funcoes) {
    for (const e of escolhidos(f.id)) linhas.push(`${f.nome}: ${nomeDe(e.id)}${e.anuencia === 'sim' ? '' : e.anuencia === 'nao' ? ' (não aceitou — volta à comissão)' : ' (aguardando anuência)'}`);
  }
  linhas.push('', org ? 'A igreja vota estes nomes, e também o quórum da comissão. O pastor é membro e presidente da comissão de nomeações (Manual da Igreja, cap. 10).' : 'Primeira leitura: não se vota. A igreja tem uma semana para trazer observações à comissão, pessoalmente.');
  return linhas.join('\n');
}

function desenharQR(texto) {
  const alvo = document.getElementById('qr');
  if (!alvo || alvo.dataset.feito === texto) return;
  const q = qrcode(0, 'M'); q.addData(texto); q.make();
  alvo.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  alvo.dataset.feito = texto;
}

// Sugestão de corte: mantém mais ou menos a metade mais marcada, nunca corta empate, tira quem ninguém marcou.
function sugerirCorte(ids, cons) {
  const n = {}; ids.forEach(id => n[id] = cons[id] ? cons[id].nota : null);
  const ordem = [...ids].sort((a, b) => (n[b] ?? -1) - (n[a] ?? -1) || porNome(nomeDe(a), nomeDe(b)));
  const comNota = ordem.filter(id => n[id] !== null);
  if (!comNota.length) return { ordem, fica: ordem, notas: n };
  const alvo = Math.min(comNota.length, Math.max(2, Math.ceil(ids.length / 2)));
  let corte = alvo; const limite = n[comNota[corte - 1]];
  while (corte < comNota.length && n[comNota[corte]] === limite) corte++;
  return { ordem, fica: comNota.slice(0, corte), notas: n };
}

function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('ver'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('ver'), 2600);
}

  else if (el.id === 'novaFuncaoIn') S.ui.novaFuncao = el.value;
  else if (el.id === 'nomeIn') S.ui.nomeDigitado = el.value;
  else if (el.id === 'codigoIn') S.ui.codigoDigitado = el.value;
  else if (el.dataset.nota) localStorage.setItem(el.dataset.nota, el.value);
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || ev.target.tagName === 'TEXTAREA') return;
  const map = { nomeIn: 'entrarReuniao', codigoIn: 'entrarReuniao', presNomeIn: 'wizIgreja', igrejaIn: 'wizIgreja', novaFuncaoIn: 'addFuncao' };
  const a = map[ev.target.id]; if (a) { ev.preventDefault(); ACOES[a](); }
});

iniciar().catch(e => console.error(e));

</script>
